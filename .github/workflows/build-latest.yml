name: Build Latest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Monthly, 1st at 06:30 UTC. All build inputs are pinned/frozen upstream
    # (minio/minio is archived, console + mds are pinned refs, mc is frozen),
    # so the only thing a rebuild picks up is Alpine base-image security patches.
    - cron: '30 6 1 * *'
  workflow_dispatch:

concurrency:
  group: build-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 240

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Free disk space
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/local/share/dotnet /usr/share/dotnet /opt/ghc

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: firstfinger/minio:latest
        build-args: |
          MINIO_VERSION=latest
          CONSOLE_VERSION=v1.7.6
          MDS_COMMIT=027fb7f9834e2bd6daba7f62a9d04d9a3606fbe1
        # Registry cache, not type=gha: GitHub evicts unused caches after 7 days,
        # which would leave every monthly run cold. This persists in Docker Hub.
        cache-from: type=registry,ref=firstfinger/minio:buildcache-latest
        cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=firstfinger/minio:buildcache-latest,mode=max' || '' }}
        provenance: false
        sbom: false
